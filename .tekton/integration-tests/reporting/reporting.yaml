---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ols-console-reporting
spec:
  description: |
    Weekly report for the periodic lightspeed-console integration tests.

    Queries kubearchive for all PipelineRuns of the configured tests during the
    last 7 days (grouped by calendar day of creation) and emails an HTML report
    to the stakeholders.

    Design notes:
    - Runs are matched by name prefix and creation date only. There is no
      matching against the cron schedule: cron -> scheduler -> PipelineRun
      latency and pod-start delays make scheduled times unreliable, and the
      creation timestamps are shown in the report anyway.
    - kubearchive's default --limit is 100, but the namespace sees hundreds of
      PipelineRuns per day, so each day is queried separately with an explicit
      limit. A single 7-day query would silently truncate.
    - Days on which a test produced no runs are reported explicitly, which is
      the reliable "missed schedule" signal.
  params:
    - name: namespace
      description: 'Namespace where the test PipelineRuns are run'
      default: 'crt-nshift-lightspeed-tenant'
    - name: application
      description: 'Name of application where the tests run'
      default: 'ols'
    - name: tests-names
      type: array
      description: 'List of test name prefixes to report on (PipelineRun names start with these)'
      default:
        - 'e2e-console-pf5'
        - 'e2e-console-pf6'
        - 'coo-lightspeed-main'
        - 'coo-lightspeed-419'
        - 'coo-lightspeed-pf5'
    - name: tests-times
      type: array
      description: >
        Deprecated: scheduled run times are no longer used for matching and this
        parameter is ignored. It is kept so existing IntegrationTestScenarios
        that still pass it keep working; drop it from the scenario when
        updating it.
      default: []
    - name: stakeholder-emails
      description: 'Comma-separated list of email addresses to send the report to'
      default: 'openshift-lightspeed@redhat.com'
  tasks:
    - name: extract-tests-info-and-send-email
      description: Gather PipelineRuns of the configured tests from the last 7 days and email the report
      params:
        - name: NAMESPACE
          value: $(params.namespace)
        - name: APPLICATION
          value: $(params.application)
        - name: TESTS_NAMES
          value: $(params.tests-names[*])
        - name: STAKEHOLDER-EMAILS
          value: $(params.stakeholder-emails)
      taskSpec:
        params:
          - name: NAMESPACE
          - name: APPLICATION
          - name: TESTS_NAMES
            type: array
          - name: STAKEHOLDER-EMAILS
        steps:
          - name: get-tests-info-and-send-email
            image: registry.redhat.io/ubi9/ubi:latest
            env:
              - name: NAMESPACE
                value: $(params.NAMESPACE)
              - name: APPLICATION
                value: $(params.APPLICATION)
              - name: KONFLUX_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: konflux-bot-0-konflux-token
                    key: konflux-token
              - name: STAKEHOLDER_EMAILS
                value: $(params.STAKEHOLDER-EMAILS)
              - name: SMTP_SERVER
                value: "smtp.gmail.com:587"
              - name: USERNAME
                valueFrom:
                  secretKeyRef:
                    name: gwsa-email-account
                    key: username
              - name: PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: gwsa-email-account
                    key: password
            args:
              - $(params.TESTS_NAMES[*])
            script: |
              #!/bin/bash
              set -euo pipefail

              echo "Reporting on tests in namespace: $NAMESPACE" >&2
              echo "Window: last 7 days (UTC calendar days)" >&2

              dnf -y install jq wget s-nail >/dev/null
              wget --no-verbose -O oc.tar.gz https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/latest/openshift-client-linux.tar.gz \
                  && tar -xzf oc.tar.gz \
                  && chmod +x kubectl oc \
                  && mv oc kubectl /usr/local/bin/ \
                  && rm -rf oc.tar.gz
              curl -sLO https://github.com/kubearchive/kubearchive/releases/latest/download/kubectl-ka-linux-amd64 \
                  && chmod +x kubectl-ka-* \
                  && mv kubectl-ka-linux-amd64 /usr/local/bin/kubectl-ka

              echo "Logging into cluster with sa token and configuring host for kubearchive" >&2
              oc login --token="${KONFLUX_TOKEN}" --server=https://api.stone-prd-rh01.pg1f.p1.openshiftapps.com:6443 >/dev/null
              kubectl-ka config set host https://kubearchive-api-server-product-kubearchive.apps.stone-prd-rh01.pg1f.p1.openshiftapps.com

              # ------------------------------------------------------------------
              # Fetch all PipelineRuns created in the last 7 UTC days.
              # One query per day: kubearchive's default --limit is 100 and the
              # namespace sees hundreds of runs per day, so a single 7-day
              # query would silently truncate. Failures degrade to an empty
              # day rather than aborting the report.
              # ------------------------------------------------------------------
              # Capture the UTC date once so all query bounds and the rendered
              # window are derived from the same day even if UTC midnight passes
              # while the report is being generated.
              REPORT_DATE=$(date -u +%F)

              # Days whose kubearchive query failed (rendered as QUERY FAILED
              # rows instead of being conflated with a missed schedule).
              FAILED_DAYS=""

              fetch_week() {
                local all_runs=""
                local day_offset after before day_json day
                for day_offset in 0 1 2 3 4 5 6; do
                  after=$(date -u -d "${REPORT_DATE} - ${day_offset} days 00:00:00" +"%Y-%m-%dT%H:%M:%SZ")
                  before=$(date -u -d "${after} + 1 day" +"%Y-%m-%dT%H:%M:%SZ")
                  echo "Querying pipelineruns created ${after} .. ${before}" >&2
                  day_json=$(kubectl-ka get pipelinerun -n "$NAMESPACE" \
                    --after "$after" \
                    --before "$before" \
                    --archived \
                    --limit 1000 \
                    -o json 2>/dev/null || echo "QUERY_FAILED")
                  if [ "$day_json" = "QUERY_FAILED" ]; then
                    day=$(date -u -d "${REPORT_DATE} - ${day_offset} days" +%F)
                    echo "WARNING: kubearchive query failed for ${day}; reporting it as QUERY FAILED" >&2
                    FAILED_DAYS="${FAILED_DAYS} ${day}"
                    day_json='{"items":[]}'
                  fi
                  all_runs="${all_runs}${day_json}"$'\n'
                done
                echo "$all_runs"
              }

              WEEK_RUNS=$(fetch_week)

              # Days of the reporting window, oldest first, derived from the
              # same captured REPORT_DATE as the queries
              WINDOW_DAYS=""
              for day_offset in 6 5 4 3 2 1 0; do
                WINDOW_DAYS="${WINDOW_DAYS}$(date -u -d "${REPORT_DATE} - ${day_offset} days" +%F) "
              done

              # ------------------------------------------------------------------
              # Aggregate per test: all runs in the window (sorted, newest last)
              # plus the window days on which the test produced no runs.
              # ------------------------------------------------------------------
              report_for_test() {
                local prefix=$1
                echo "$WEEK_RUNS" | jq -s \
                  --arg prefix "$prefix" \
                  --arg namespace "$NAMESPACE" \
                  --arg app "$APPLICATION" \
                  --arg days "$WINDOW_DAYS" '
                  [ .[] | (.items // [])[]
                    | select(.metadata.name | startswith($prefix))
                    # Periodic runs only: the scheduler labels the snapshot with
                    # test.appstudio.openshift.io/run=<scenario>, which the
                    # PipelineRun inherits. Per-PR gate runs (which also match
                    # the name prefix) do not carry the label and are excluded.
                    # The label value is not required to equal the prefix so
                    # partial prefixes keep working (e.g. "e2e-console".
                    # matching runs of scenario "e2e-console-pf5").
                    | select((.metadata.labels["test.appstudio.openshift.io/run"] // "") != "") ]
                  | sort_by(.metadata.creationTimestamp)
                  | {
                      test: $prefix,
                      runs: map({
                        name: .metadata.name,
                        status: (if (.status.conditions[0].status == "True" and .status.conditions[0].reason == "Succeeded") then "SUCCEEDED"
                                 elif (.status.conditions[0].status == "False" and .status.conditions[0].reason == "Failed") then "FAILED"
                                 elif (.status.conditions[0].reason == "Running" or .status.conditions[0].reason == "Started") then "RUNNING"
                                 else "UNKNOWN" end),
                        created: .metadata.creationTimestamp,
                        log_link: "https://konflux-ui.apps.stone-prd-rh01.pg1f.p1.openshiftapps.com/ns/\($namespace)/applications/\($app)/pipelineruns/\(.metadata.name)"
                      }),
                      days_without_runs: (
                        ($days | split(" ") | map(select(length > 0))) -
                        (map(.metadata.creationTimestamp[0:10]))
                        | unique
                      )
                    }'
              }

              TESTS_ARRAY=("$@")
              TEST_RESULTS="["
              for test_name in "${TESTS_ARRAY[@]}"; do
                echo "=== Gathering results for ${test_name} ===" >&2
                RESULT=$(report_for_test "$test_name")
                TEST_RESULTS="${TEST_RESULTS}${RESULT},"
              done
              TEST_RESULTS="${TEST_RESULTS%,}]"

              echo "Report data:" >&2
              echo "$TEST_RESULTS" | jq '.' >&2

              # ------------------------------------------------------------------
              # Render HTML
              # ------------------------------------------------------------------
              # Render one row per run; days of the window without runs get
              # an explicit empty row so gaps are visible inside the table.
              # shellcheck disable=SC2155  # local x=$(...) masks jq failures on
              # purpose: a failed lookup must degrade to an empty row instead
              # of aborting the report under set -e.
              format_results_html() {
                local data="$1"
                local test_name=$(echo "$data" | jq -r '.test // "Unknown"')

                echo "<h2>${test_name} Tests</h2>"
                echo "<table border='1' cellpadding='8' cellspacing='0' style='border-collapse: collapse; width: 100%;'>"
                echo "<thead style='background-color: #f0f0f0;'>"
                echo "<tr><th>Pipeline Run</th><th>Status</th><th>Created (UTC)</th><th>Logs</th></tr>"
                echo "</thead>"
                echo "<tbody>"
                for day in $WINDOW_DAYS; do
                  local day_runs=$(echo "$data" | jq -c --arg day "$day" '[.runs[] | select(.created[0:10] == $day)]')
                  if [ "$(echo "$day_runs" | jq 'length')" -eq 0 ]; then
                    if [[ " $FAILED_DAYS " == *" $day "* ]]; then
                      echo "<tr style='color: orange;'>"
                      echo "<td>&mdash;</td>"
                      echo "<td>QUERY FAILED</td>"
                      echo "<td>${day}</td>"
                      echo "<td>&mdash;</td>"
                      echo "</tr>"
                      continue
                    fi
                    echo "<tr style='color: gray;'>"
                    echo "<td>&mdash;</td>"
                    echo "<td>NO RUNS</td>"
                    echo "<td>${day}</td>"
                    echo "<td>&mdash;</td>"
                    echo "</tr>"
                    continue
                  fi
                  echo "$day_runs" | jq -c '.[]' | while read -r run; do
                    local name=$(echo "$run" | jq -r '.name')
                    local status=$(echo "$run" | jq -r '.status')
                    local created=$(echo "$run" | jq -r '.created')
                    local log_link=$(echo "$run" | jq -r '.log_link')
                    local status_color="gray"
                    case "$status" in
                      SUCCEEDED) status_color="green" ;;
                      FAILED) status_color="red" ;;
                      RUNNING) status_color="blue" ;;
                    esac
                    echo "<tr>"
                    echo "<td>${name}</td>"
                    echo "<td style='color: ${status_color}; font-weight: bold;'>${status}</td>"
                    echo "<td>${created}</td>"
                    echo "<td><a href='${log_link}'>View Logs</a></td>"
                    echo "</tr>"
                  done
                done
                echo "</tbody>"
                echo "</table>"
                echo "<br/>"
              }

              NUM_TESTS=$(echo "$TEST_RESULTS" | jq 'length')
              HTML_TEST_RESULTS=""
              for i in $(seq 0 $((NUM_TESTS - 1))); do
                HTML_TEST_RESULTS+=$(format_results_html "$(echo "$TEST_RESULTS" | jq -c ".[$i]")")
              done

              SUBJECT="OpenShift Lightspeed Console Test Report - $(date -u '+%Y-%m-%d')"

              cat > /tmp/email_body.html <<EMAILEOF
              <!DOCTYPE html>
              <html>
              <head>
                <style>
                  body { font-family: Arial, sans-serif; }
                  h1 { color: #333; }
                  table { margin-top: 10px; margin-bottom: 20px; }
                </style>
              </head>
              <body>
                <h1>OpenShift Lightspeed Console - Weekly Test Report</h1>
                <p>This report lists all runs of the periodic console tests in the last 7 days, grouped by test.</p>
                <hr/>
                ${HTML_TEST_RESULTS}
                <hr/>
                <p style='color: #666; font-size: 12px;'>
                  Generated automatically by the ols-console-reporting pipeline on $(date -u)
                </p>
              </body>
              </html>
              EMAILEOF

              # ------------------------------------------------------------------
              # Send email
              # ------------------------------------------------------------------
              echo "Sending report to: $STAKEHOLDER_EMAILS" >&2
              if s-nail \
                -S mta="smtp://${SMTP_SERVER}" \
                -S smtp-use-starttls \
                -S smtp-auth=login \
                -S smtp-auth-user="${USERNAME}" \
                -S smtp-auth-password="${PASSWORD}" \
                -S from="noreply@redhat.com" \
                -s "$SUBJECT" \
                -M "text/html" \
                "$STAKEHOLDER_EMAILS" < /tmp/email_body.html; then
                echo "Email sent successfully!" >&2
              else
                echo "ERROR: Failed to send email (exit code: $?)" >&2
                exit 1
              fi
